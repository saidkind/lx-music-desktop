name: Run build test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - dev
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Eslint check
        run: npm run lint

      - name: Test playback and local update policy
        run: node --test tests/*.test.cjs

      - name: Test Build
        run: npm run build
